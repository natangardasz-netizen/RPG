<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mesa Digital RPG</title>
    <link rel="stylesheet" href="RPG.css" />
  </head>

  <body>
    <div id="app">
      <header class="topbar">
        <div class="controles">
          <button id="mostrarMapas">☰ Mapas</button>
          <button id="mostrarGrid">⊞ Grade</button>
          <button id="zoomMais">+</button>
          <button id="zoomMenos">−</button>
          <button id="centralizar">⌂ Centralizar</button>
          <button id="telaCheia">⛶ Tela cheia</button>
          <button id="musicas">🎵 Músicas</button>
          <button id="medir">📏 Medir</button>
          <button id="desenhar">✏️ Desenhar</button>
          <button id="espelhoH">🔄 Girar 90°</button>
          <button id="espelhoV">🙃 Girar 180°</button>
          <button id="limparDesenho">🧹 Limpar</button>
        </div>
      </header>

      <div class="conteudo">
        <aside class="painelMapas">
          <div class="cabecalhoMapas">
            <h2>🗺️ Meus mapas</h2>
            <label for="arquivoMapa" class="botaoAdicionar">
              + Adicionar
            </label>
            <input type="file" id="arquivoMapa" accept="image/*" hidden />
          </div>

          <div id="listaMapas">
            <p class="semMapas">Nenhum mapa adicionado.</p>
          </div>
        </aside>

        <aside class="painelMusicas">
          <div class="cabecalhoMusicas">
            <h2>🎵 Músicas</h2>
            <label for="arquivoMusica" class="botaoAdicionar">
              + Adicionar
            </label>
            <input
              type="file"
              id="arquivoMusica"
              accept="audio/*"
              multiple
              hidden
            />
          </div>

          <div id="listaMusicas">
            <p class="semMusicas">Nenhuma música adicionada.</p>
          </div>

          <div class="playerMusica">
            <div id="musicaAtual" class="musicaAtual">
              Nenhuma música selecionada
            </div>
            <audio id="playerAudio" controls></audio>
          </div>
        </aside>

        <main id="areaMapa">
          <div id="mensagem">
            <h2>🎲 Mesa Digital RPG</h2>
            <p>Adicione um mapa para começar.</p>
            <label for="arquivoMapa" class="botaoGrande">
              📁 Adicionar primeiro mapa
            </label>
          </div>

          <img id="mapa" alt="Mapa de RPG" />
          <div id="grid"></div>
          <div id="regua"></div>
          <canvas id="canvasDesenho"></canvas>
        </main>
      </div>
    </div>

    <script src="RPG.js"></script>
  </body>
</html>
